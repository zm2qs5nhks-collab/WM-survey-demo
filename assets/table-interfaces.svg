<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 940" width="1700" height="940" role="img" aria-label="Supervision and model interfaces">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#cbd5e1" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1700" height="940" fill="url(#bg)"/>
  <rect width="1700" height="940" fill="url(#grid)"/>
  <rect x="20" y="20" width="1660" height="900" rx="14" fill="#ffffff"
        stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="12 10"/>

  <text x="48" y="74" font-family="'Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="22" font-weight="700" letter-spacing="2.5" fill="#6366f1">TABLE SCREENSHOT</text>
  <text x="48" y="126" font-family="'Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="34" font-weight="700" fill="#334155">Supervision and model interfaces</text>
  <text x="48" y="166" font-family="'Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="19" fill="#64748b">Manuscript Table 2 — which query each system can answer</text>

  <g opacity="0.5">
    <rect x="48" y="210" width="1604" height="44" rx="6" fill="#e2e8f0"/>
    <rect x="48" y="270" width="1604" height="34" rx="6" fill="#eef2f7"/>
    <rect x="48" y="314" width="1604" height="34" rx="6" fill="#eef2f7"/>
    <rect x="48" y="358" width="1604" height="34" rx="6" fill="#eef2f7"/>
    <rect x="48" y="402" width="1604" height="34" rx="6" fill="#eef2f7"/>
  </g>

  <text x="48" y="830" font-family="'Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="20" fill="#475569">占位图 · PLACEHOLDER</text>
  <text x="48" y="866" font-family="'Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="18" fill="#94a3b8">替换为论文 Table 2 截图。A/G/S 三列标记依赖原始列几何，故此处不复排。</text>
</svg>
