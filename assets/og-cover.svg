<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="55%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.16" cy="0.1" r="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.13"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#g)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- 标签 -->
  <rect x="72" y="84" width="316" height="46" rx="23" fill="#ffffff" opacity="0.16"/>
  <text x="98" y="115" font-family="'Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="21" font-weight="700" letter-spacing="3" fill="#ffffff">COMPREHENSIVE SURVEY</text>

  <!-- 标题 -->
  <text x="72" y="248" font-family="'Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="67" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Sample Survey Title</text>
  <text x="72" y="324" font-family="'Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="65" font-weight="800" fill="#c7d2fe" letter-spacing="-1.5">A Template for Survey Sites</text>

  <!-- 分隔线 -->
  <rect x="72" y="374" width="104" height="6" rx="3" fill="#5eead4"/>

  <!-- 作者 -->
  <text x="72" y="438" font-family="'Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="27" fill="#ffffff" opacity="0.92">First Author · Second Author · Third Author · Fourth Author</text>
  <text x="72" y="484" font-family="'Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="23" fill="#ffffff" opacity="0.7">Your University · Another University · A Company or Institute</text>

  <!-- 底部三点式要点 -->
  <g font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="21" fill="#ffffff" opacity="0.85">
    <circle cx="80" cy="556" r="6" fill="#5eead4"/>
    <text x="102" y="563">Taxonomy</text>
    <circle cx="268" cy="556" r="6" fill="#5eead4"/>
    <text x="290" y="563">Timeline</text>
    <circle cx="436" cy="556" r="6" fill="#5eead4"/>
    <text x="458" y="563">Benchmarks</text>
  </g>

  <text x="1128" y="578" text-anchor="end" font-family="'Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="20" fill="#ffffff" opacity="0.6">example.com</text>
</svg>
